name: Release on Push or Manual Dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (will be automatically extracted from header.rpy if not specified)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    - name: Extract build configuration from header.rpy
      id: get_version
      run: |
        header_path="game/Submods/MAICA_MttsSubmod/header.rpy"
        version=$(sed -nE "s/^[[:space:]]*mtts_version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"][[:space:]]*$/\1/p" "$header_path")
        development=$(sed -nE "s/^[[:space:]]*maica_is_dev[[:space:]]*=[[:space:]]*(True|False)[[:space:]]*$/\1/p" "$header_path")
        if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
          echo "Expected exactly one mtts_version assignment" >&2
          exit 1
        fi
        if [ "$development" != "True" ] && [ "$development" != "False" ]; then
          echo "maica_is_dev must be assigned exactly once to True or False" >&2
          exit 1
        fi
        echo "Extracted version: $version"
        echo "Development build: $development"
        echo "version=$version" >> $GITHUB_OUTPUT
        if [ "$development" = "True" ]; then
          echo "is_development=true" >> $GITHUB_OUTPUT
        else
          echo "is_development=false" >> $GITHUB_OUTPUT
        fi

    - name: Use provided or extracted version
      id: set_version
      run: |
        version="${{ github.event.inputs.version }}"
        if [ -z "$version" ]; then
          version="${{ steps.get_version.outputs.version }}"
        fi
        echo "Using version: $version"
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Check if release exists
      id: check_release
      if: steps.get_version.outputs.is_development == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release=$(curl -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.set_version.outputs.version }})

        if echo "$release" | grep -q "message.*Not Found"; then
          echo "Release does not exist"
          echo "create_release=true" >> $GITHUB_OUTPUT
        else
          echo "Release already exists"
          echo "create_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Download Ignore Translation Conflicts dependency
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        dependency_url="https://github.com/MAS-Submod-MoyuTeam/MAS_ignore_tl_conficts_submod/archive/refs/tags/v1.0.0.zip"
        dependency_dir=$(mktemp -d)
        trap 'rm -rf "$dependency_dir"' EXIT

        curl --fail --location --retry 3 --silent --show-error \
          "$dependency_url" --output "$dependency_dir/dependency.zip"
        mkdir -p "$dependency_dir/source"
        unzip -q "$dependency_dir/dependency.zip" -d "$dependency_dir/source"

        source_dir=$(find "$dependency_dir/source" -mindepth 1 -maxdepth 1 -type d -print -quit)
        test -n "$source_dir"
        test -f "$source_dir/game/Submods/IgnoreTranslationConflicts/zz_ignore_translation_conflicts.rpy"
        cp -R "$source_dir/game/." game/

    - name: Create release version file
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        mkdir -p game/python-packages
        echo "${{ steps.set_version.outputs.version }}" > game/python-packages/mtts_release_version

    - name: Copy documentation into submod package
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        cp README.md README_EN.md LICENSE game/Submods/MAICA_MttsSubmod/

    - name: Create zip package
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        zip -r MAICA_MttsSubmod-${{ steps.set_version.outputs.version }}.zip \
          game \
          lib

    - name: Generate Release Notes
      id: generate_release_notes
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        # Extract release notes from the latest commit message or a predefined template
        release_notes=$(git log -1 --pretty=%B)
        # Convert release notes to GitHub Flavored Markdown
        echo "$release_notes" | sed 's/^/- /' > release_notes.md
        # Prepend version information
        echo "## MAICA MttsSubmod ${{ steps.set_version.outputs.version }}" | cat - release_notes.md > temp && mv temp release_notes.md
        echo "RELEASE_NOTES_PATH=release_notes.md" >> $GITHUB_OUTPUT

    - name: Create Release
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.set_version.outputs.version }}
        body_path: ${{ steps.generate_release_notes.outputs.RELEASE_NOTES_PATH }}
        files: |
          MAICA_MttsSubmod-${{ steps.set_version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Skip release if already exists
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'false'
      run: |
        echo "Release ${{ steps.set_version.outputs.version }} already exists. Skipping release creation."

    - name: Skip development build
      if: steps.get_version.outputs.is_development == 'true'
      run: |
        echo "Development build ${{ steps.set_version.outputs.version }} is not eligible for release."

    - name: Upload artifact
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: |
          MAICA_MttsSubmod-${{ steps.set_version.outputs.version }}.zip
          release_notes.md
        retention-days: 30
